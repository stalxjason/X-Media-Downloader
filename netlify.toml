# Netlify 部署配置
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# ─────────────────────────────────────────────────────────────
# 反代规则（必须排在 SPA fallback 前面，Netlify 按顺序匹配）
# ─────────────────────────────────────────────────────────────

# GraphQL：交给 Netlify Function 注入 Cookie / csrf 头
[[redirects]]
  from = "/xapi/*"
  to = "/.netlify/functions/xapi?__p=:splat"
  status = 200
  force = true

# 图片：走 Netlify 边缘代理，浏览器无需直连 pbs.twimg.com
[[redirects]]
  from = "/m/*"
  to = "https://pbs.twimg.com/:splat"
  status = 200
  force = true

# 视频：同上
[[redirects]]
  from = "/v/*"
  to = "https://video.twimg.com/:splat"
  status = 200
  force = true

# SPA 路由 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker 必须从根路径加载，不能缓存
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# 安全 headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
